# Build, tag, and push the Docker image to the GitLab Docker registry
build ofc25:
  variables:
    TEST_NAME: 'ofc25'
  stage: build
  before_script:
    - docker image prune --force
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker buildx build -t "${TEST_NAME}:latest" -f ./src/tests/${TEST_NAME}/Dockerfile .
    - docker tag "${TEST_NAME}:latest" "$CI_REGISTRY_IMAGE/${TEST_NAME}:latest"
    - docker push "$CI_REGISTRY_IMAGE/${TEST_NAME}:latest"
  after_script:
    - docker image prune --force
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH)'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
    - changes:
      - src/common/**/*.py
      - proto/*.proto
      - src/tests/${TEST_NAME}/**/*.{py,in,sh,yml}
      - src/tests/${TEST_NAME}/Dockerfile
      - .gitlab-ci.yml

# Deploy TeraFlowSDN and Execute end-2-end test
end2end_test ofc25:
  timeout: 90m
  variables:
    TEST_NAME: 'ofc25'
  stage: end2end_test
  # Disable to force running it after all other tasks
  #needs:
  #  - build ofc25
  before_script:
    # Do Docker cleanup
    - docker ps --all --quiet | xargs --no-run-if-empty docker stop
    - docker container prune --force
    - docker ps --all --quiet | xargs --no-run-if-empty docker rm --force
    - docker image prune --force
    - docker network prune --force
    - docker volume prune --all --force
    - docker buildx prune --force

    # Check MicroK8s is ready
    - microk8s status --wait-ready
    - LOOP_MAX_ATTEMPTS=10
    - LOOP_COUNTER=0
    - >
      while ! kubectl get pods --all-namespaces &> /dev/null; do
        printf "%c" "."
        sleep 1
        LOOP_COUNTER=$((LOOP_COUNTER + 1))
        if [ "$LOOP_COUNTER" -ge "$LOOP_MAX_ATTEMPTS" ]; then
          echo "Max attempts reached, exiting the loop."
          exit 1
        fi
      done
    - kubectl get pods --all-namespaces

    # Delete secondary ingress controllers
    - kubectl delete -f src/tests/${TEST_NAME}/nginx-ingress-controller-opt.yaml --ignore-not-found
    - kubectl delete -f src/tests/${TEST_NAME}/nginx-ingress-controller-ip.yaml --ignore-not-found
    - kubectl delete -f src/tests/${TEST_NAME}/nginx-ingress-controller-e2e.yaml --ignore-not-found

    # Always delete Kubernetes namespaces
    - export K8S_NAMESPACES=$(kubectl get namespace -o jsonpath='{.items[*].metadata.name}')
    - echo "K8S_NAMESPACES=${K8S_NAMESPACES}"

    - export OLD_NATS_NAMESPACES=$(echo "${K8S_NAMESPACES}" | tr ' ' '\n' | grep -E '^nats')
    - echo "OLD_NATS_NAMESPACES=${OLD_NATS_NAMESPACES}"
    - >
      for ns in ${OLD_NATS_NAMESPACES}; do
        if [[ "$ns" == nats* ]]; then
          if helm3 status "$ns" &>/dev/null; then
            helm3 uninstall "$ns" -n "$ns"
          else
            echo "Release '$ns' not found, skipping..."
          fi
        fi
      done
    - export OLD_NAMESPACES=$(echo "${K8S_NAMESPACES}" | tr ' ' '\n' | grep -E '^(tfs|crdb|qdb|kafka|nats)')
    - echo "OLD_NAMESPACES=${OLD_NAMESPACES}"
    - kubectl delete namespace ${OLD_NAMESPACES} || true

    # Clean-up Kubernetes Failed pods
    - >
      kubectl get pods --all-namespaces --no-headers --field-selector=status.phase=Failed
      -o custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name |
      xargs --no-run-if-empty --max-args=2 kubectl delete pod --namespace

    # Login Docker repository
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

  script:
    # Download Docker image to run the test
    - docker pull "${CI_REGISTRY_IMAGE}/${TEST_NAME}:latest"
    - docker pull asgamb1/oc23bgp.img:latest
    - docker pull asgamb1/flexscale-node.img:latest

    # Check MicroK8s is ready
    - microk8s status --wait-ready
    - LOOP_MAX_ATTEMPTS=10
    - LOOP_COUNTER=0
    - >
      while ! kubectl get pods --all-namespaces &> /dev/null; do
        printf "%c" "."
        sleep 1
        LOOP_COUNTER=$((LOOP_COUNTER + 1))
        if [ "$LOOP_COUNTER" -ge "$LOOP_MAX_ATTEMPTS" ]; then
          echo "Max attempts reached, exiting the loop."
          exit 1
        fi
      done
    - kubectl get pods --all-namespaces

    # Deploy Optical Device Node Agents
    - >
      docker network create -d bridge --subnet=172.254.253.0/24 --gateway=172.254.253.254
      --ip-range=172.254.253.0/24 na-br
    - >
      docker run -dit --init --name na-t1 --network=na-br --ip 172.254.253.101 --publish 2022
      --volume "$PWD/src/tests/${TEST_NAME}/node-agents-config/startNetconfAgent-tp.sh:/confd/examples.confd/OC23/startNetconfAgent.sh"
      --volume "$PWD/src/tests/${TEST_NAME}/node-agents-config/platform_t1.xml:/confd/examples.confd/OC23/platform.xml"
      asgamb1/oc23bgp.img:latest /confd/examples.confd/OC23/startNetconfAgent.sh
    - >
      docker run -dit --init --name na-t2 --network=na-br --ip 172.254.253.102 --publish 2022
      --volume "$PWD/src/tests/${TEST_NAME}/node-agents-config/startNetconfAgent-tp.sh:/confd/examples.confd/OC23/startNetconfAgent.sh"
      --volume "$PWD/src/tests/${TEST_NAME}/node-agents-config/platform_t2.xml:/confd/examples.confd/OC23/platform.xml"
      asgamb1/oc23bgp.img:latest /confd/examples.confd/OC23/startNetconfAgent.sh
    - >
      docker run -dit --init --name na-r1 --network=na-br --ip 172.254.253.201 --publish 2022
      --volume "$PWD/src/tests/${TEST_NAME}/node-agents-config/startNetconfAgent-mg-on.sh:/confd/examples.confd/OC23/startNetconfAgent.sh"
      --volume "$PWD/src/tests/${TEST_NAME}/node-agents-config/platform_r1.xml:/confd/examples.confd/OC23/platform.xml"
      asgamb1/flexscale-node.img:latest /confd/examples.confd/OC23/startNetconfAgent.sh
    - >
      docker run -dit --init --name na-r2 --network=na-br --ip 172.254.253.202 --publish 2022
      --volume "$PWD/src/tests/${TEST_NAME}/node-agents-config/startNetconfAgent-mg-on.sh:/confd/examples.confd/OC23/startNetconfAgent.sh"
      --volume "$PWD/src/tests/${TEST_NAME}/node-agents-config/platform_r2.xml:/confd/examples.confd/OC23/platform.xml"
      asgamb1/flexscale-node.img:latest /confd/examples.confd/OC23/startNetconfAgent.sh


    # Wait for initialization of Optical Device Node Agents
    - sleep 3
    - docker ps -a
    - while ! docker logs na-t1 2>&1 | grep -q '*** ConfD OpenConfig NETCONF agent ***'; do sleep 1; done
    - while ! docker logs na-t2 2>&1 | grep -q '*** ConfD OpenConfig NETCONF agent ***'; do sleep 1; done
    - while ! docker logs na-r1 2>&1 | grep -q '*** ConfD OpenConfig NETCONF agent ***'; do sleep 1; done
    - while ! docker logs na-r2 2>&1 | grep -q '*** ConfD OpenConfig NETCONF agent ***'; do sleep 1; done
    - sleep 3
    - docker ps -a


    # Configure TeraFlowSDN deployment
    # Uncomment if DEBUG log level is needed for the components
    #- yq -i '((select(.kind=="Deployment").spec.template.spec.containers.[] | select(.name=="server").env.[]) | select(.name=="LOG_LEVEL").value) |= "DEBUG"' manifests/contextservice.yaml
    #- yq -i '((select(.kind=="Deployment").spec.template.spec.containers.[] | select(.name=="server").env.[]) | select(.name=="LOG_LEVEL").value) |= "DEBUG"' manifests/deviceservice.yaml
    #- yq -i '((select(.kind=="Deployment").spec.template.spec.containers.[] | select(.name=="frontend").env.[]) | select(.name=="LOG_LEVEL").value) |= "DEBUG"' manifests/pathcompservice.yaml
    #- yq -i '((select(.kind=="Deployment").spec.template.spec.containers.[] | select(.name=="server").env.[]) | select(.name=="LOG_LEVEL").value) |= "DEBUG"' manifests/serviceservice.yaml
    #- yq -i '((select(.kind=="Deployment").spec.template.spec.containers.[] | select(.name=="server").env.[]) | select(.name=="LOG_LEVEL").value) |= "DEBUG"' manifests/sliceservice.yaml
    #- yq -i '((select(.kind=="Deployment").spec.template.spec.containers.[] | select(.name=="server").env.[]) | select(.name=="LOG_LEVEL").value) |= "DEBUG"' manifests/nbiservice.yaml
    #- yq -i '((select(.kind=="Deployment").spec.template.spec.containers.[] | select(.name=="server").env.[]) | select(.name=="LOG_LEVEL").value) |= "DEBUG"' manifests/opticalcontrollerservice.yaml
    #- yq -i '((select(.kind=="Deployment").spec.template.spec.containers.[] | select(.name=="server").env.[]) | select(.name=="LOG_LEVEL").value) |= "DEBUG"' manifests/e2e_orchestratorservice.yaml
    #- yq -i '((select(.kind=="Deployment").spec.template.spec.containers.[] | select(.name=="server").env.[]) | select(.name=="LOG_LEVEL").value) |= "DEBUG"' manifests/vnt_managerservice.yaml


    # ===== Deploy Optical TeraFlowSDN ==================================================
    - source src/tests/${TEST_NAME}/deploy_specs_opt.sh

    # Create secondary ingress controllers
    - kubectl apply -f src/tests/${TEST_NAME}/nginx-ingress-controller-opt.yaml

    # Change the name for the database
    - cp manifests/contextservice.yaml manifests/contextservice.yaml.bak
    - |
      sed -i '/name: CRDB_DATABASE/{n;s/value: .*/value: "tfs_opt_context"/}' manifests/contextservice.yaml

    - ./deploy/crdb.sh
    - ./deploy/nats.sh
    - ./deploy/kafka.sh
    # - ./deploy/qdb.sh
    # - ./deploy/expose_dashboard.sh
    - ./deploy/tfs.sh
    - ./deploy/show.sh

    - mv manifests/contextservice.yaml.bak manifests/contextservice.yaml
    - mv tfs_runtime_env_vars.sh tfs_runtime_env_vars_opt.sh

    ## Wait for Context to be subscribed to NATS
    #- while ! kubectl --namespace ${TFS_K8S_NAMESPACE} logs deployment/contextservice -c server 2>&1 | grep -q 'Subscriber is Ready? True'; do sleep 1; done
    #- kubectl --namespace ${TFS_K8S_NAMESPACE} logs deployment/contextservice -c server


    # ===== Deploy Packet TeraFlowSDN ===================================================
    - source src/tests/${TEST_NAME}/deploy_specs_ip.sh

    # Create secondary ingress controllers
    - kubectl apply -f src/tests/${TEST_NAME}/nginx-ingress-controller-ip.yaml

    # Change the name for the database
    - cp manifests/contextservice.yaml manifests/contextservice.yaml.bak
    - |
      sed -i '/name: CRDB_DATABASE/{n;s/value: .*/value: "tfs_ip_context"/}' manifests/contextservice.yaml

    - ./deploy/crdb.sh
    - ./deploy/nats.sh
    - ./deploy/kafka.sh
    # - ./deploy/qdb.sh
    # - ./deploy/expose_dashboard.sh
    - ./deploy/tfs.sh
    - ./deploy/show.sh

    - mv manifests/contextservice.yaml.bak manifests/contextservice.yaml
    - mv tfs_runtime_env_vars.sh tfs_runtime_env_vars_ip.sh

    ## Wait for Context to be subscribed to NATS
    #- while ! kubectl --namespace ${TFS_K8S_NAMESPACE} logs deployment/contextservice -c server 2>&1 | grep -q 'Subscriber is Ready? True'; do sleep 1; done
    #- kubectl --namespace ${TFS_K8S_NAMESPACE} logs deployment/contextservice -c server


    # ===== Deploy End-to-End TeraFlowSDN ===============================================
    - source src/tests/${TEST_NAME}/deploy_specs_e2e.sh

    # Create secondary ingress controllers
    - kubectl apply -f src/tests/${TEST_NAME}/nginx-ingress-controller-e2e.yaml

    # Change the name for the database
    - cp manifests/contextservice.yaml manifests/contextservice.yaml.bak
    - |
      sed -i '/name: CRDB_DATABASE/{n;s/value: .*/value: "tfs_e2e_context"/}' manifests/contextservice.yaml

    - ./deploy/crdb.sh
    - ./deploy/nats.sh
    - ./deploy/kafka.sh
    # - ./deploy/qdb.sh
    # - ./deploy/expose_dashboard.sh
    - ./deploy/tfs.sh
    - ./deploy/show.sh

    - mv manifests/contextservice.yaml.bak manifests/contextservice.yaml
    - mv tfs_runtime_env_vars.sh tfs_runtime_env_vars_e2e.sh

    # Wait for Context to be subscribed to NATS
    - while ! kubectl --namespace ${TFS_K8S_NAMESPACE} logs deployment/contextservice -c server 2>&1 | grep -q 'Subscriber is Ready? True'; do sleep 1; done
    - kubectl --namespace ${TFS_K8S_NAMESPACE} logs deployment/contextservice -c server


    # ===== Run End-to-End tests ========================================================
    - if docker ps -a | grep ${TEST_NAME}; then docker rm -f ${TEST_NAME}; fi
    - export TFS_RUNNER_IP=$(ip -4 route get 1.1.1.1 | awk '{for (i=1; i<=NF; ++i) if ($i == "src") {print $(i+1); exit}}')
    - if [ -z "${TFS_RUNNER_IP}" ]; then export TFS_RUNNER_IP=$(hostname -I | awk '{print $1}'); fi
    - if [ -z "${TFS_RUNNER_IP}" ]; then echo "Unable to determine TFS_RUNNER_IP on GitLab runner host"; exit 1; fi
    - echo "Using GitLab runner host IP ${TFS_RUNNER_IP} for OFC25 E2E descriptor materialization"
    - >
      docker run -t --rm --name ${TEST_NAME} --network=host 
      --env TFS_RUNNER_IP="${TFS_RUNNER_IP}"
      --volume "$PWD/tfs_runtime_env_vars_opt.sh:/var/teraflow/tfs_runtime_env_vars_opt.sh"
      --volume "$PWD/tfs_runtime_env_vars_ip.sh:/var/teraflow/tfs_runtime_env_vars_ip.sh"
      --volume "$PWD/tfs_runtime_env_vars_e2e.sh:/var/teraflow/tfs_runtime_env_vars_e2e.sh"
      --volume "$PWD/src/tests/${TEST_NAME}:/opt/results"
      $CI_REGISTRY_IMAGE/${TEST_NAME}:latest

  after_script:
    # Persist TeraFlowSDN and node-agent logs as artifacts instead of dumping them into the CI job log
    - mkdir -p src/tests/${TEST_NAME}/logs
    - kubectl logs --namespace tfs-e2e deployment/contextservice -c server > src/tests/${TEST_NAME}/logs/e2e-contextservice-server.log 2>&1 || true
    - kubectl logs --namespace tfs-e2e deployment/deviceservice -c server > src/tests/${TEST_NAME}/logs/e2e-deviceservice-server.log 2>&1 || true
    - kubectl logs --namespace tfs-e2e deployment/serviceservice -c server > src/tests/${TEST_NAME}/logs/e2e-serviceservice-server.log 2>&1 || true
    - kubectl logs --namespace tfs-e2e deployment/pathcompservice -c frontend > src/tests/${TEST_NAME}/logs/e2e-pathcompservice-frontend.log 2>&1 || true
    - kubectl logs --namespace tfs-e2e deployment/pathcompservice -c backend > src/tests/${TEST_NAME}/logs/e2e-pathcompservice-backend.log 2>&1 || true
    - kubectl logs --namespace tfs-e2e deployment/webuiservice -c server > src/tests/${TEST_NAME}/logs/e2e-webuiservice-server.log 2>&1 || true
    - kubectl logs --namespace tfs-e2e deployment/nbiservice -c server > src/tests/${TEST_NAME}/logs/e2e-nbiservice-server.log 2>&1 || true
    - kubectl logs --namespace tfs-e2e deployment/e2e-orchestratorservice -c server > src/tests/${TEST_NAME}/logs/e2e-e2e-orchestratorservice-server.log 2>&1 || true
    - kubectl logs --namespace tfs-ip deployment/contextservice -c server > src/tests/${TEST_NAME}/logs/ip-contextservice-server.log 2>&1 || true
    - kubectl logs --namespace tfs-ip deployment/deviceservice -c server > src/tests/${TEST_NAME}/logs/ip-deviceservice-server.log 2>&1 || true
    - kubectl logs --namespace tfs-ip deployment/serviceservice -c server > src/tests/${TEST_NAME}/logs/ip-serviceservice-server.log 2>&1 || true
    - kubectl logs --namespace tfs-ip deployment/pathcompservice -c frontend > src/tests/${TEST_NAME}/logs/ip-pathcompservice-frontend.log 2>&1 || true
    - kubectl logs --namespace tfs-ip deployment/pathcompservice -c backend > src/tests/${TEST_NAME}/logs/ip-pathcompservice-backend.log 2>&1 || true
    - kubectl logs --namespace tfs-ip deployment/webuiservice -c server > src/tests/${TEST_NAME}/logs/ip-webuiservice-server.log 2>&1 || true
    - kubectl logs --namespace tfs-ip deployment/nbiservice -c server > src/tests/${TEST_NAME}/logs/ip-nbiservice-server.log 2>&1 || true
    - kubectl logs --namespace tfs-ip deployment/vnt-managerservice -c server > src/tests/${TEST_NAME}/logs/ip-vnt-managerservice-server.log 2>&1 || true
    - kubectl logs --namespace tfs-opt deployment/contextservice -c server > src/tests/${TEST_NAME}/logs/opt-contextservice-server.log 2>&1 || true
    - kubectl logs --namespace tfs-opt deployment/deviceservice -c server > src/tests/${TEST_NAME}/logs/opt-deviceservice-server.log 2>&1 || true
    - kubectl logs --namespace tfs-opt deployment/serviceservice -c server > src/tests/${TEST_NAME}/logs/opt-serviceservice-server.log 2>&1 || true
    - kubectl logs --namespace tfs-opt deployment/pathcompservice -c frontend > src/tests/${TEST_NAME}/logs/opt-pathcompservice-frontend.log 2>&1 || true
    - kubectl logs --namespace tfs-opt deployment/pathcompservice -c backend > src/tests/${TEST_NAME}/logs/opt-pathcompservice-backend.log 2>&1 || true
    - kubectl logs --namespace tfs-opt deployment/webuiservice -c server > src/tests/${TEST_NAME}/logs/opt-webuiservice-server.log 2>&1 || true
    - kubectl logs --namespace tfs-opt deployment/nbiservice -c server > src/tests/${TEST_NAME}/logs/opt-nbiservice-server.log 2>&1 || true
    - kubectl logs --namespace tfs-opt deployment/opticalcontrollerservice -c server > src/tests/${TEST_NAME}/logs/opt-opticalcontrollerservice-server.log 2>&1 || true
    - docker logs na-t1 > src/tests/${TEST_NAME}/logs/na-na-t1.log 2>&1 || true
    - docker logs na-t2 > src/tests/${TEST_NAME}/logs/na-na-t2.log 2>&1 || true
    - docker logs na-r1 > src/tests/${TEST_NAME}/logs/na-na-r1.log 2>&1 || true
    - docker logs na-r2 > src/tests/${TEST_NAME}/logs/na-na-r2.log 2>&1 || true

    # Clean up
    - docker ps --all --quiet | xargs --no-run-if-empty docker stop
    - docker container prune --force
    - docker ps --all --quiet | xargs --no-run-if-empty docker rm --force
    - docker network prune --force
    - docker volume prune --all --force
    - docker image prune --force

    - kubectl delete namespaces tfs-ip tfs-opt tfs-e2e --ignore-not-found
    - kubectl delete -f src/tests/${TEST_NAME}/nginx-ingress-controller-opt.yaml --ignore-not-found
    - kubectl delete -f src/tests/${TEST_NAME}/nginx-ingress-controller-ip.yaml --ignore-not-found
    - kubectl delete -f src/tests/${TEST_NAME}/nginx-ingress-controller-e2e.yaml --ignore-not-found
    - helm3 uninstall --namespace nats-e2e nats-e2e || echo "Namespace not found"
    - helm3 uninstall --namespace nats-ip nats-ip || echo "Namespace not found"
    - helm3 uninstall --namespace nats-opt nats-opt || echo "Namespace not found"
    - kubectl delete namespaces nats-ip nats-opt nats-e2e --ignore-not-found
    - kubectl delete namespaces crdb qdb-e2e qdb-opt qdb-ip --ignore-not-found

  #coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH)'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
  artifacts:
      when: always
      paths:
        - ./src/tests/${TEST_NAME}/logs/*.log
      reports:
        junit: ./src/tests/${TEST_NAME}/report_*.xml
